# Migrated from .npmrc (pnpm 11: .npmrc is auth/registry only)
shamefullyHoist: true
strictPeerDependencies: false

# ----------------------------------------------------------------------------------
# Accepted, individually justified advisories.
#
# This list exists so `pnpm audit` — and with it `pnpm run check` — can exit 0 without
# a blanket escape hatch (a non-blocking CI job, or people learning to skip a
# permanently red check). An entry here suppresses exactly ONE advisory, so anything
# new still turns the audit red.
#
# Rules for adding one — all FOUR, or do not add it:
#   1. name the advisory,
#   2. state why it is here: either the dependency provably cannot be fixed, OR the
#      code IS fixed and the advisory is a false positive (an upstream range that was
#      never narrowed). Those are different claims — do not blur them.
#   3. say why the residual risk is acceptable,
#   4. date the verification.
# Exhaust the fix first — see the `overrides` below, where the same advisory IS closed
# for every path that can be moved.
#
# The full policy, including the ignoreGhsas scoping trap and how to verify a patch
# claim at a package's `main` entry point, lives in /SECURITY.md.
#
# NOTE on the report line: `pnpm audit` COUNTS ignored advisories in its summary, so it
# prints "1 high (1 ignored)" and still exits 0. The count is informational; the exit
# code is the gate. Do not chase the number to zero by widening this list.
# ----------------------------------------------------------------------------------
# There is deliberately no `auditConfig.ignoreGhsas` block: `pnpm audit` is clean on
# its own merits, with nothing suppressed.
#
# GHSA-mh99-v99m-4gvg (brace-expansion, HIGH) lived here until 2026-08-22 as a
# documented false positive — GitHub's range was then a blanket `<= 5.0.7` that swept
# up the patched 1.x backports. The entry named its own removal condition ("re-verify
# when the upstream range is narrowed"), and that condition is now met: the advisory
# reads per-major windows (`< 1.1.17`, `< 2.1.3`, `< 3.0.3`, `< 5.0.8`), and the two
# lines in this tree — 1.1.18 and 5.0.9 — sit above every one of them.
#
# Two things learned there are worth keeping, because they outlive the entry:
#
# 1. `ignoreGhsas` is keyed on the GHSA id ALONE. No package, version or path filter —
#    an entry hides the advisory EVERYWHERE in the graph, permanently. And since lt CLI
#    1.42.0 `auditConfig` is hoisted as a UNION into every generated project, so an
#    entry here silences it for every customer workspace, not just this one.
#
# 2. brace-expansion is NOT dev-only here. It has a live production path,
#    `@lenne.tech/nest-server > ts-morph > @ts-morph/common > minimatch > brace-expansion`
#    (`ts-morph` is a prod dependency), patched today only because the minimatch
#    override below lifts it onto the 5.x line. After every nest-server bump, run
#    `pnpm list --prod --depth Infinity | grep -A1 minimatch` and confirm the resolved
#    brace-expansion is still on a patched release before trusting a green audit.
#
# Why some paths stay on the old lines at all: two consumers are stuck on minimatch@3
# (`@nestjs/cli > fork-ts-checker-webpack-plugin`, `standard-version > dotgitignore`).
# They `require('minimatch')` and call the result, while brace-expansion@5 and
# minimatch@10 export a namespace object rather than a callable, so lifting either
# throws at require time. The 1.x backport is what closes those.
#
# The second advisory, GHSA-rgw5-rvv9-x895, was never suppressed and must not be — the
# pins below were raised to 1.1.18 / 2.1.4 / 5.0.9 to close it outright.

# pnpm 11 configuration
#
# NOTE: As of pnpm 11 the "pnpm.overrides" and "pnpm.onlyBuiltDependencies"
# fields in package.json are NO LONGER read. They live here instead:
#   - overrides:      replaces package.json > pnpm.overrides
#   - allowBuilds:    replaces package.json > pnpm.onlyBuiltDependencies
# See https://pnpm.io/settings

# ---------------------------------------------------------------------------
# Dependency overrides (security fixes / peer-conflict resolution)
#
# Override TARGETS (right-hand side) MUST be FIXED versions — never ranges
# like ">=X" or "^X" (pnpm would silently install newer majors).
# A range on the LEFT side selects which installed versions are replaced.
# Each override is documented below with: what / why (CVE) / transitive chain.
# ---------------------------------------------------------------------------
overrides:
  # ---- ONE RULE PER PACKAGE. Read this before adding an entry. ----------------
  #
  # An override key is matched against the REQUESTED RANGE (semver intersection),
  # not against the resolved version. So even a bounded key like `ip-address@<10.3.1`
  # fires for a consumer asking `^10.0.0` and pins the WHOLE tree to the target.
  # Every entry below is therefore a HARD PIN, and a target left behind the newest
  # release in its major silently becomes a DOWNGRADE LOCK.
  #
  # Two rules for the same package fight, and the loser is invisible. Until
  # 2026-08-22 this block carried BOTH of these:
  #     '@hono/node-server': 1.19.14          # BELOW the >=2.0.10 that fixes the CVEs
  #     '@hono/node-server@<2.0.10': 2.0.11   # above it
  # The tree happened to land on 2.0.11, so `pnpm audit` was green while the
  # configuration said the opposite — one edit away from shipping the advisory.
  # The same shape existed for `hono` (bare 4.12.25, below the 4.12.27 fix, rescued
  # only by a second ranged entry). Both bare entries are gone; see below.
  #
  # HOW TO VERIFY an entry is still doing something, and doing it in the right
  # direction — the ONLY honest test:
  #     cp package.json pnpm-workspace.yaml /tmp/withA/ ; strip `overrides:` for /tmp/withoutB/
  #     (cd /tmp/withA   && pnpm install --lockfile-only)
  #     (cd /tmp/withoutB && pnpm install --lockfile-only && pnpm audit)
  #     diff the resolved versions of the two lockfiles
  # Diffing against the COMMITTED lockfile proves nothing — it already carries the pins.
  # If the no-override resolve is NEWER than the pin, the entry is a downgrade lock:
  # raise the target and the key together. If the no-override resolve is already above
  # the advisory floor AND the audit is clean, keep the entry as a bounded floor so a
  # future range narrowing cannot reopen the hole — but never let it cap a patched
  # release.
  # ----------------------------------------------------------------------------

  # Peer-conflict + security: @nestjs/apollo pulls in
  # @apollo/server-plugin-landing-page-graphql-playground@4.0.1 (peerDep
  # @apollo/server@^4), conflicting with @lenne.tech/nest-server which depends on
  # @apollo/server@5.5.1. Forces a single v5 instance. Also covers the CVE in
  # @apollo/server <5.5.0. Bare on purpose: this is a LOCKSTEP entry — the target
  # must equal the version @lenne.tech/nest-server declares (5.5.1 today), or the
  # hoisted linker puts a second copy in the tree. Move it when the framework moves.
  # Remove once the playground plugin accepts v5.
  '@apollo/server': 5.5.1

  # Security: SSRF via NO_PROXY bypass (GHSA-3p68-rc4w-qgx5), Cloud Metadata
  # Exfiltration via Header Injection (GHSA-fvcv-3m26-pcqx) in axios <1.15.0, plus
  # formDataToJSON recursion DoS + prototype pollution in auth subfields (3x moderate)
  # in axios <1.18.0. Transitive via @lenne.tech/nest-server>node-mailjet (and
  # >@getbrevo/brevo, when that path is present).
  # 2026-08-22: was an unqualified `axios: 1.18.1`, which had become a downgrade lock —
  # a fresh resolve without it lands on 1.19.0. Key bounded to the advisory floor and
  # target raised, so this can only ever lift a vulnerable version.
  'axios@<1.18.0': 1.19.0

  # Security: 3x Hono, all moderate, all patched >=4.12.27 — GHSA-xgm2-5f3f-mvvc
  # (API-Gateway adapter), GHSA-hvrm-45r6-mjfj (jsx request-context bleed),
  # GHSA-w62v-xxxg-mg59 (cx() XSS bypass). Plus the earlier <4.12.18 set (prototype
  # pollution, bodyLimit bypass, JSX tag injection, CSS declaration injection, Vary
  # header bypass, JWT NumericDate validation).
  # Transitive via @lenne.tech/nest-server>@modelcontextprotocol/sdk (and, before it
  # left the tree, >@nestjs/terminus>prisma>@prisma/dev — that chain is GONE, which is
  # why the old bare entry's justification no longer applied).
  # 2026-08-22: consolidated from TWO rules (`hono: 4.12.25` + `hono@>=4.0.0 <4.12.34`)
  # into one. The bare entry pinned 4.12.25 — BELOW the 4.12.27 fix — and was only
  # rescued by the ranged one. Target raised to the newest 4.x; a fresh resolve without
  # any hono override lands on 4.13.3.
  'hono@>=4.0.0 <4.12.27': 4.13.3

  # REMOVED 2026-08-22: '@hono/node-server' (both the bare 1.19.14 entry and the
  # ranged '@hono/node-server@<2.0.10': 2.0.11).
  # @modelcontextprotocol/sdk@1.30.0 declares "^1.19.9 || ^2.0.5", so a fresh resolve
  # picks the newest 2.x (2.1.1) on its own — above the >=2.0.10 that fixes
  # GHSA-frvp-7c67-39w9 and GHSA-9mqv-5hh9-4cgg. Evidence: `pnpm why @hono/node-server`
  # reports that SDK as the only consumer (the @nestjs/terminus>prisma>@prisma/dev chain
  # the old comment named is no longer in the tree at all), and a no-override resolve
  # audits clean at 2.1.1 while the entries held the tree at 2.0.11.
  # @lenne.tech/nest-server 11.36.1 retired its own copy for the same reason — see
  # node_modules/@lenne.tech/nest-server/docs/security-overrides.md, "Retired".
  # Do NOT re-add unless the SDK narrows its range back to ^1.

  # Security: Code Injection and Prototype Pollution in lodash <=4.17.23.
  # Transitive via multiple chains (@nestjs/swagger among them).
  # Key bounded 2026-08-22 so a future 4.18.x cannot be capped by this pin.
  'lodash@<=4.17.23': 4.18.1

  # Security: ReDoS in ajv >=7.0.0-alpha.0 <8.18.0. Transitive via
  # @compodoc/compodoc>@angular-devkit/schematics>@angular-devkit/core and
  # @lenne.tech/nest-server>@modelcontextprotocol/sdk>ajv.
  # 2026-08-22: was an unqualified `ajv: 8.20.0`, which also dragged the untouched
  # ajv@6 consumers across a MAJOR (ajv 6 -> 8 changes the export shape and adds strict
  # mode — the same class of break the minimatch bound below guards against). Key
  # narrowed to the advisory range: 7.x/8.x consumers are lifted, 6.x is left alone.
  # With that bound the tree resolves ajv 6.15.0 / 8.18.0 / 8.20.0 side by side, all at
  # or above the fix, and the audit stays clean — so this is now a floor, not a lift.
  'ajv@>=7.0.0-alpha.0 <8.18.0': 8.20.0

  # Security: ReDoS via extglob quantifiers (high, >=4.0.0 <4.0.4) AND Method
  # Injection in POSIX Character Classes (moderate) in picomatch. Transitive via
  # @compodoc/compodoc>@angular-devkit/schematics>@angular-devkit/core.
  # 2026-08-22: was an unqualified `picomatch: 4.0.4`, which lifted the picomatch@2
  # consumers across two majors AND capped the 4.x line one patch below latest. Key
  # bounded to the advisory range, target raised to 4.0.5. A no-override resolve keeps
  # picomatch@2.3.2 alongside 4.0.5 and audits clean, so 2.x needs no lift.
  'picomatch@>=4.0.0 <4.0.4': 4.0.5

  # Security: Multiple CVEs in vite (arbitrary file read via WebSocket, fs.deny
  # bypass, path traversal in .map handling, plus the fs.deny bypass on Windows
  # alternate paths fixed in 8.0.16). Dev/test only (vitest, vite-plugin-node).
  # 8.2.2 still satisfies the vite-plugin-node@8 peer (vite@^8) and pulls
  # postcss@^8.5.x (see the postcss entry). Target raised 8.0.16 -> 8.2.2 and key
  # bounded 2026-08-22; a no-override resolve lands on 8.2.2.
  'vite@<8.0.16': 8.2.2

  # Security: Missing buffer bounds check in uuid v3/v5/v6 generators when buf is
  # provided (GHSA-w5hq-g745-h8pq, <11.1.1). Transitive via @compodoc/compodoc.
  # The API used (uuid.v4) is stable across 8-14, so the cross-major target is safe.
  # 2026-08-22: was an unqualified `uuid: 14.0.0`, capping the package below latest.
  # Key bounded to the advisory; @compodoc/compodoc@2.0.0 now declares a range that
  # already reaches 14.x, so a fresh resolve lands on 14.0.1 by itself and this entry
  # no longer fires. Kept as a FLOOR: if a consumer narrows back onto the 11.x line it
  # would be lifted rather than silently reopening GHSA-w5hq-g745-h8pq.
  'uuid@<11.1.1': 14.0.2

  # Security: Remotely triggerable DoS in qs.stringify (GHSA-q8mj-m7cp-5q26,
  # >=6.11.1 <=6.15.1). Transitive via @apollo/server>body-parser>qs and
  # express>body-parser>qs. Target raised 6.15.2 -> 6.15.3 and key bounded 2026-08-22.
  'qs@>=6.11.1 <=6.15.1': 6.15.3

  # Security: Memory exhaustion DoS + uninitialized memory disclosure in ws
  # >=8.0.0 <8.21.0 (GHSA-96hv-2xvq-fx4p). Transitive via @nestjs/graphql>graphql-ws>ws
  # and @nestjs/graphql>ws.
  # THE TARGET MUST EQUAL THE ws VERSION @lenne.tech/nest-server DECLARES (8.21.3 today,
  # as an ordinary dependency). Under the hoisted linker a LOWER target does not leave
  # you one patch behind — it puts a SECOND, older ws copy in the tree next to the
  # declared one. Raised 8.21.0 -> 8.21.3 on 2026-08-22; the upper bound moves with it
  # so the declared 8.21.3 itself is never matched. Move both when the framework moves.
  'ws@>=8.0.0 <8.21.3': 8.21.3
  # The 7.x line (deprecated subscriptions-transport-ws>ws) stays on 7.x — patched
  # release, raised 7.5.11 -> 7.5.13 on 2026-08-22 (latest 7.x).
  'ws@>=7.0.0 <7.5.13': 7.5.13

  # Security: fast-uri — FOUR advisories, all covered by 3.1.4:
  #   <=3.1.1  path traversal via percent-encoded dot segments (GHSA-q3j6-qgpj-74h6)
  #   <=3.1.1  host confusion via percent-encoded authority delimiters (GHSA-v39h-62p7-jpjc)
  #   <3.1.3   host confusion via failed IDN canonicalization (GHSA-4c8g-83qw-93j6, high)
  #   <=3.1.3  host confusion via literal backslash delimiter (GHSA-v2hh-gcrm-f6hx, high)
  # Transitive via @compodoc/compodoc>@angular-devkit/*>ajv>fast-uri and
  # @lenne.tech/nest-server>@modelcontextprotocol/sdk>ajv.
  #
  # This REPLACED an earlier unqualified `fast-uri: 3.1.2` entry. That one fixed the first two
  # advisories and then became a DOWNGRADE-LOCK: an unqualified key matches every version and
  # pins it, so when the two 2026 advisories landed it actively held the package on a vulnerable
  # 3.1.2 — and, being unqualified, it silently overruled the bounded entry added next to it.
  # (That is the same defect the `hono` / `@hono/node-server` pairs had; see the header.)
  # Keep the key bounded so it can only ever raise a vulnerable version, never cap a patched one.
  # 3.1.5 is the newest 3.x; 4.x is a major and nothing requests it. Drop once ajv /
  # ajv-formats request >=3.1.4 themselves.
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5

  # Security: body-parser DoS on malformed urlencoded input
  # (GHSA-v422-hmwv-36x6, low, patched >=2.3.0). Transitive via
  # @lenne.tech/nest-server>@as-integrations/express5 and express itself.
  # 2.3.0 is the newest 2.x. Drop once express / @apollo/server request >=2.3.0.
  'body-parser@>=2.0.0 <2.3.0': 2.3.0

  # Security: Overlong UTF-8 decoding in @protobufjs/utf8 <=1.1.0. Transitive
  # via @lenne.tech/nest-server>@apollo/server>@apollo/usage-reporting-protobuf
  # >@apollo/protobufjs>@protobufjs/utf8.
  # Key bounded and target raised 1.1.1 -> 1.1.2 on 2026-08-22 (was an unqualified
  # entry capping the package one patch below latest).
  '@protobufjs/utf8@<1.1.1': 1.1.2

  # Security: brace-expansion DoS via unbounded expansion (GHSA-mh99-v99m-4gvg /
  # CVE-2026-14257, high). The fix was backported to EVERY release line, so all three
  # pins below land on patched code.
  #
  # Patch status measured at each package's `main` entry point:
  #   1.1.16 vulnerable → 1.1.17, 1.1.18 patched
  #   2.1.2  vulnerable → 2.1.4        patched
  #   5.0.7  vulnerable → 5.0.8, 5.0.9 patched
  # The targets were raised 1.1.17 -> 1.1.18 and 5.0.8 -> 5.0.9 on 2026-08-11 for the
  # FOLLOW-UP advisory GHSA-rgw5-rvv9-x895 (unbounded intermediate arrays), which the
  # earlier patch levels do not cover.
  # CAUTION when re-verifying: 1.1.16 and 2.1.2 ship a stray `dist/` that DOES contain
  # the fix while `main` points at the unpatched root `index.js`. Grepping the whole
  # package says "patched"; only the entry point tells the truth.
  #
  # Which line a path gets is decided by its `minimatch`, so that is the real lever:
  #   minimatch@10 -> brace-expansion@5
  #   minimatch@9  -> brace-expansion@2
  #   minimatch@3  -> brace-expansion@1
  # See the `minimatch` override below, which lifts every 9.x consumer onto 10.x. The
  # 1.x line cannot be lifted (its consumers call the require() result, and 5.x exports
  # a namespace object) — which is exactly why the 1.x backport matters.
  #
  # Targets are the NEWEST patched release that also clears the minimumReleaseAge gate
  # (see bottom of this file) — not the minimum that merely clears the advisory,
  # because an override is a hard PIN and would hold the package back, and not a
  # release younger than the cutoff either, because that fails `pnpm install` with
  # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION. Verified 2026-08-22: 1.1.18, 2.1.4 and
  # 5.0.9 are still the newest in their lines. When bumping these, check
  # `npm view <pkg> time` against the cutoff first.
  #
  # The `>=3.0.0` lower bound also sweeps in 3.x/4.x. Those are ESM-only
  # (`type: module`), so lifting them to 5.x (dual ESM+CJS) is a widening, not a break.
  # Nothing in the tree uses them today.
  'brace-expansion@>=3.0.0 <5.0.9': 5.0.9
  'brace-expansion@<1.1.18': 1.1.18
  # Matches nothing today (the minimatch 9 -> 10 lift removed the only 2.x consumer),
  # and is kept deliberately: the advisory is suppressed repo-wide via ignoreGhsas at
  # the top of this file, so a 2.x path reappearing later would NOT turn the audit red.
  # This pin is what keeps that silent case patched. Cheap insurance — do not tidy away.
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4

  # Security: lifts every minimatch 9.x consumer onto 10.x so it inherits the PATCHED
  # brace-expansion 5.x. 10.2.6 REQUESTS ^5.0.8 itself, so the fix arrives through the
  # dependency graph rather than only via the companion brace-expansion override.
  # Closes the @swc/cli paths.
  #
  # THE LOWER BOUND OF 9.0.0 IS LOAD-BEARING — do not widen it. Verified 2026-07-30 by
  # requiring each published major:
  #   minimatch@3.1.5   typeof 'function'  callable
  #   minimatch@5.1.6   typeof 'function'  callable
  #   minimatch@7.4.6   typeof 'function'  callable
  #   minimatch@8.0.4   typeof 'function'  callable
  #   minimatch@9.0.9   typeof 'object'    NOT callable
  #   minimatch@10.2.6  typeof 'object'    NOT callable
  # The namespace-object shape starts at 9, so 9 -> 10 is shape-preserving and safe.
  # Majors 5-8 are callable exactly like the 3.x deliberately excluded below; lifting
  # them to 10 would throw `TypeError: minimatch is not a function` at require time —
  # inside a Docker build or CI job, not on a developer machine. This bound used to
  # read `>=5.0.0`, which covered them.
  #
  # minimatch@3 is deliberately NOT touched: its consumers (dotgitignore,
  # fork-ts-checker-webpack-plugin) DO call it as a callable and would throw.
  'minimatch@>=9.0.0 <10.2.6': 10.2.6

  # Security: postcss <=8.5.17 (GHSA-r28c-9q8g-f849, high), patched >=8.5.18.
  # Dev/test only: the dominant path is this project's own `vitest` devDependency
  # (vitest > @vitest/mocker > vite > postcss). A secondary path runs through
  # better-auth > vitest, but that peer is optional and pruned by `--prod`, so no
  # postcss reaches the production image either way.
  # Target raised 8.5.25 -> 8.5.26 on 2026-08-22 (newest 8.x).
  'postcss@<8.5.25': 8.5.26

  # Security: CRLF injection via unescaped multipart field names/filenames in
  # form-data <4.0.6 (GHSA-hmw2-7cc7-3qxx). Transitive via
  # @lenne.tech/nest-server>node-mailjet>axios (and >@getbrevo/brevo>axios).
  # 4.0.6 is the newest 4.x.
  'form-data@<4.0.6': 4.0.6

  # Security: Prototype pollution / special-character handling in js-yaml <4.1.2.
  # Transitive via eslint, cosmiconfig and (historically) @nestjs/swagger.
  # NOTE: js-yaml never published a 4.1.2; the 4.x line ends at 4.3.1, which is the
  # fixed target for every ^4 consumer.
  # 2026-08-22: was an unqualified `js-yaml: 4.3.1`. @nestjs/swagger@11.4.7 now declares
  # js-yaml ^5, so the bare key was force-DOWNGRADING a direct dependency's own dep
  # across a major. Key bounded to the advisory: ^4 consumers are lifted to 4.3.1, ^5
  # consumers are left on the (unaffected, audit-clean) 5.x line.
  'js-yaml@<4.1.2': 4.3.1

  # Security: Email injection / header-related CVEs in nodemailer <9.0.1 (high).
  # Transitive via @lenne.tech/nest-server. LOCKSTEP entry: the target must equal the
  # version the framework declares (9.0.5 today) — a lower target puts a second copy in
  # the hoisted tree. Raised 9.0.3 -> 9.0.5 on 2026-08-22 alongside nest-server 11.36.1.
  nodemailer: 9.0.5

  # Security: Unhandled multipart errors / DoS in multer <2.2.0 (high).
  # Transitive via @lenne.tech/nest-server and @nestjs/platform-express, and a direct
  # dependency here. LOCKSTEP entry, aligned with the framework's exact 2.2.0
  # (also the newest release).
  multer: 2.2.0

  # Security: various undici CVEs <7.29.0 — response desynchronization,
  # cross-user information disclosure, CRLF injection via a blob-like body type,
  # cookie attribute injection (2x high, 4x moderate). Transitive via
  # @compodoc/compodoc>cheerio>undici. 7.29.0 is the newest 7.x (8.x is a major).
  'undici@>=7.0.0 <7.29.0': 7.29.0

  # Security: ip-address — Address4 decodes leading-zero octets as decimal
  # (GHSA-mwp4-54f8-5fhr, high, patched >=10.3.1), plus two moderates (CIDR
  # suffix suppressing subnet checks, IPv4-mapped/NAT64 misclassification).
  # Transitive via @lenne.tech/nest-server>@modelcontextprotocol/sdk>
  # express-rate-limit>ip-address, which declares a caret range — so the key still
  # matches by intersection and this is a hard pin, not a floor. Target raised
  # 10.3.1 -> 10.5.0 on 2026-08-22 (it was capping the package two minors back).
  'ip-address@<10.3.1': 10.5.0

  # Security: TWO advisories on the 3.x line, and the target must be the LATER of
  # the two — a 3.3.17 target closes the first and leaves the second wide open.
  #   1. a custom generator can loop indefinitely for a NON-INTEGER size
  #      (GHSA-2v37-7h3g-55p8, high, patched >=3.3.17)
  #   2. custom generators can loop indefinitely when size is ZERO
  #      (high, published 2026-08, patched >=3.3.18)
  # Dev-only: the single path is better-auth's optional `vitest` peer,
  # >vite>postcss>nanoid. Scoped to the 3.x line on purpose — 5.x/6.x are
  # unaffected and must not be dragged down. Note this override is REQUIRED here
  # even though @lenne.tech/nest-server carries the same one: pnpm overrides do
  # not reach consumers (see the framework's docs/security-overrides.md).
  'nanoid@>=3.0.0 <3.3.18': 3.3.18

  # Security: high CVE in piscina <4.9.3 - transitive via the build/test toolchain.
  # 4.9.3 is the newest 4.x (5.x is a major).
  'piscina@<4.9.3': 4.9.3

  # Security: Zip-Slip — archive extraction can create files and links outside
  # the target directory (critical, >=11.0.0 <11.1.3). Transitive via
  # @swc/cli>@xhmikosr/bin-wrapper>@xhmikosr/downloader>@xhmikosr/decompress
  # and the same chain under @nestjs/cli. @swc/cli@0.8.1 is already latest, so
  # the fix can only come from an override. @xhmikosr/downloader requires
  # ^11.1.1, so 11.1.4 satisfies it (patch bump, same engines).
  # Key bounded and target raised 11.1.3 -> 11.1.4 on 2026-08-22 (was an unqualified
  # entry capping the package one patch below latest).
  '@xhmikosr/decompress@>=11.0.0 <11.1.3': 11.1.4

  # REMOVED 2026-08-22: 'effect: 3.21.2'.
  # It existed for @prisma/config@7.4.2 pinning effect to an exact vulnerable 3.18.4,
  # reached via @lenne.tech/nest-server>@nestjs/terminus>@prisma/client>prisma. That
  # whole chain has left the tree: `pnpm why effect`, `pnpm why prisma` and
  # `pnpm why @prisma/dev` all report nothing, and the package appears in neither a
  # with-overrides nor a without-overrides fresh resolve. This is the one removal here
  # justified by the package being gone rather than by the pin being stale.
  # browserslist, two HIGH advisories on the same package, both closed here:
  #   - GHSA-c83g-rgw3-j3cx — unbounded cache growth to OOM
  #   - GHSA-73wf-gq98-2v4g — crash / prototype write via an untrusted
  #     browserslist-stats.json
  # Both `<=4.28.6`, first patched 4.28.7. Build-time only — the paths are
  # @nestjs/cli>webpack, @nestjs/cli>fork-ts-checker-webpack-plugin>webpack and
  # unplugin-swc>unplugin>webpack, none of which reach a consumer's runtime.
  # Target 4.28.8 rather than the 4.28.7 floor: it is the current release, so the
  # tree resolves one copy instead of two. Bounded key — it can only raise a
  # vulnerable version, never cap a patched one. RAISE THE TARGET when a newer
  # 4.28.x ships. Verified 2026-09-01.
  'browserslist@<4.28.7': 4.28.8


# ---------------------------------------------------------------------------
# Build script approvals (pnpm 11 replacement for onlyBuiltDependencies).
# Only these packages are permitted to run install/postinstall scripts.
# ---------------------------------------------------------------------------
allowBuilds:
  '@apollo/protobufjs': true
  '@compodoc/compodoc': true
  '@nestjs/core': true
  # Install-time analytics, reached via @nestjs/swagger > swagger-ui-dist. Its
  # postinstall (`node ./report.js`) shells out to read the dependency tree and POSTs
  # to scarf.sh — opt-in by default. Nothing at runtime needs it, and THIS file is the
  # one hoisted into every generated project, so `true` would put an install-time
  # beacon on every customer's dev machine and CI runner.
  #
  # `nest-server` has always denied it. This file said `true` — a silent drift between
  # the two maps, and the standing proof of the duplication warning below.
  '@scarf/scarf': false
  '@swc/core': true
  bcrypt: true
  # Not in this project's lockfile today (see the msgpackr note below for why that is
  # not a reason to delete an entry). Live in nest-server and nuxt-base-template, and
  # the hoist merges all three, so it is kept deliberately rather than pruned.
  esbuild: true
  # Optional native accelerator for msgpackr.
  #
  # Do NOT delete this as a dead entry. `pnpm why msgpackr-extract` in THIS repo comes
  # up empty, and the file's own no-dead-overrides rule would seem to apply — it does
  # not. `bullmq` is an OPTIONAL PEER of @lenne.tech/nest-server and is never installed
  # in npm mode (optional peers are not auto-installed, even under autoInstallPeers).
  # It becomes real in VENDOR mode — the default for `lt fullstack init` — where the
  # CLI's import-closure scanner resolves the dynamic `import('bullmq')` in
  # core-cron-jobs.service.ts into a direct dependency, pinned at bullmq@6.2.0
  # → msgpackr → msgpackr-extract@3.0.4.
  #
  # `false` costs nothing — and note it does NOT disable native acceleration. The
  # install script is `node-gyp-build-optional-packages`, and the same resolver runs
  # again at REQUIRE time against the prebuilt @msgpackr-extract/<platform> package,
  # which carries no scripts of its own. Verified in nest-server, which has the same
  # entry: `msgpackr.isNativeAccelerationEnabled === true` with the build denied. The
  # script would only ever run a redundant node-gyp compile — one that needs
  # python/make/g++ and would fail in a slim image anyway.
  #
  # This entry MUST live here, even though `nest-server` carries the identical one in
  # its own pnpm-workspace.yaml. That file never reaches a generated project: in vendor
  # mode the framework is source code rather than a dependency, and in npm mode a
  # dependency's workspace settings are not read at all. Only the settings hoisted from
  # THIS template (plus lt-monorepo's) end up in the project.
  #
  # Without it, pnpm 11 stops the very first install of a fresh `lt fullstack init`
  # with ERR_PNPM_IGNORED_BUILDS and writes the placeholder
  # `msgpackr-extract: set this to true or false` into the generated workspace file
  # — an unusable project before a single line of code is written.
  'msgpackr-extract': false

# ---------------------------------------------------------------------------
# Packages excluded from the minimum-release-age gate (allowed even if freshly
# published) — only the first-party framework itself, whose releases we trust
# and publish. Do NOT add third-party packages here permanently: if a freshly
# published transitive dep (e.g. nodemailer, bumped by nest-server) ever trips
# the gate, prefer waiting out the cutoff over a standing exemption.
#
# NOTE: use the bare PACKAGE NAME, not `name@version`. pnpm documents
# version-pinned excludes (e.g. 'nx@21.6.5'), but on pnpm 11.1.3 they are NOT
# honored by the lockfile supply-chain verification that runs at the start of
# `pnpm install` (see github.com/pnpm/pnpm/issues/10361) — a version-pinned
# '@lenne.tech/nest-server@11.26.1' was present yet still tripped
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION. The bare name IS honored and also
# drops the per-bump maintenance: freshly published releases are always allowed.
#
# WATCH OUT: `pnpm audit --fix` (which `pnpm run check:fix` runs) auto-appends entries
# here in exactly the `name@version` form this note warns against. Those are
# machine-written, not decisions — delete them again rather than leaving them. They
# read as permanent policy when they really mean "one package was fresh on the day
# someone ran --fix", and they decay into no-ops once the version clears the cutoff,
# which is why nobody notices they were wrong. If an override target trips the gate,
# pin a slightly older PATCHED release instead of adding an exemption here.
# ---------------------------------------------------------------------------
minimumReleaseAgeExclude:
  - '@lenne.tech/nest-server'
  # 2026-08-22: removed six machine-written entries left behind by `pnpm audit --fix`
  # during the 11.33.0 bump — '@nestjs/common@11.1.29', '@nestjs/core@11.1.29' and
  # '@nestjs/platform-express@11.1.29', each listed TWICE. The project now declares
  # @nestjs/* 11.2.1, so 11.1.29 no longer resolves anywhere in the tree and the lines
  # were inert. That is exactly how they decay: they read as standing policy long after
  # they stopped describing anything, and nobody notices because a no-op never fails.
  # An exemption here is only ever justified for a version that is actually being
  # installed right now; otherwise pin a slightly older patched release instead.

# ---------------------------------------------------------------------------
# Peer dependency rules — silence KNOWN-BENIGN unmet-peer warnings only.
# Scope every entry to its parent (`parent>peer`); never blanket-ignore a peer
# globally. Each entry documents what / why / when-to-drop. Verify with
# `pnpm peers check` after changing.
# ---------------------------------------------------------------------------
peerDependencyRules:
  allowedVersions:
    # @swc/cli@0.8.1 peer-wants chokidar ^5, but the tree resolves chokidar@4
    # next to it (via @nestjs/cli>@angular-devkit/core@19). chokidar's watch()
    # API is compatible 4↔5 and @swc/cli only uses it for --watch. A global
    # `overrides: chokidar` would break nodemon (^3) and @angular-devkit (^4),
    # so scope-allow 4 here. Drop once @nestjs/cli ships chokidar 5.
    '@swc/cli>chokidar': '4'

    # graphql-upload@15.0.2 peer-wants @types/express ^4, but this project runs
    # express@5 (direct dep) with @types/express@5 to match. The peer range is
    # stale and graphql-upload's express typing surface stays compatible.
    # Type-only, dev-time mismatch. Drop once graphql-upload widens its peer.
    'graphql-upload>@types/express': '5'
